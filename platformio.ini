; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5paper_s3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DM5PAPER_S3
	-Os
	-I src/epub
	-D SERIAL_DEBUG  ; Comment out this line to disable serial logging for production
	-D MINIZ_NO_PNG_WRITER
	-D MINIZ_NO_ZLIB_COMPATIBLE_NAMES
lib_deps =
	m5stack/M5GFX@^0.2.0
	h2zero/NimBLE-Arduino@^1.4.0
	bblanchon/ArduinoJson@^7.0.0
	SD
	m5stack/M5Unified@^0.2.11
	knolleary/PubSubClient@^2.8
	; tinyxml2 is now in lib/ folder (local copy without test files)
lib_extra_dirs = 
	lib
lib_ldf_mode = deep+
upload_speed = 921600
build_type = debug
debug_tool = esp-builtin
