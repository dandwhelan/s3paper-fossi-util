; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` stays the development build; the release build is opt-in
default_envs = m5paper_s3

[common]
; Flags shared by both builds. Serial/USB flags differ per env - see below.
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DM5PAPER_S3
	-Os
	-I src/epub
	-D MINIZ_NO_PNG_WRITER
	-D MINIZ_NO_ZLIB_COMPATIBLE_NAMES

[env:m5paper_s3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:add_network_lib.py
build_flags =
	${common.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-D SERIAL_DEBUG  ; use the m5paper_s3_release env for production instead
lib_deps =
	m5stack/M5GFX@^0.2.0
	h2zero/NimBLE-Arduino@^1.4.0
	bblanchon/ArduinoJson@^7.0.0
	SD
	m5stack/M5Unified@^0.2.11
	knolleary/PubSubClient@^2.8
	; tinyxml2 is now in lib/ folder (local copy without test files)
lib_extra_dirs = 
	lib
lib_ldf_mode = deep+
upload_speed = 921600
build_type = debug
debug_tool = esp-builtin

; Production build for battery use in the van.
;   pio run -e m5paper_s3_release -t upload
;
; Drops SERIAL_DEBUG and USB CDC. Most Serial.print calls in this codebase
; are NOT wrapped in #ifdef SERIAL_DEBUG, so the flag alone silences almost
; nothing - what does it is Serial never being opened (main.cpp leaves
; cfg.serial_baudrate at 0 without SERIAL_DEBUG) plus CDC_ON_BOOT=0, which
; points Serial at an uninitialised UART0 instead of the USB CDC stack.
; Trade-off: no serial log and no exception decoder, so flash the debug env
; when chasing a crash.
[env:m5paper_s3_release]
extends = env:m5paper_s3
build_type = release
build_flags =
	${common.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=0
